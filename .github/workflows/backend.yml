name: Backend CI

on:
  push:
    branches: [master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    name: Django Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django system checks
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost
        run: python manage.py check

      - name: Run migrations (SQLite — no external DB needed)
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost
        run: python manage.py migrate --run-syncdb

      - name: Run tests
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost
        run: python manage.py test --verbosity=2

  # ── Deploy to Render on push to main ────────────────────────────────────
  # Render also auto-deploys when connected to GitHub, so this step is
  # optional — it just triggers an immediate deploy after CI passes.
  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy hook
        # Add RENDER_DEPLOY_HOOK as a secret in your GitHub repo settings:
        # Settings → Secrets → Actions → New repository secret
        # Get the hook URL from: Render dashboard → your service → Settings → Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Deploy triggered."
          else
            echo "RENDER_DEPLOY_HOOK secret not set — skipping manual trigger."
            echo "Render will still auto-deploy if the GitHub repo is connected."
          fi
